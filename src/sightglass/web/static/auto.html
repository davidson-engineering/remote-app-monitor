<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor</title>
  <script src="/_sightglass/theme.js"></script>
  <link rel="stylesheet" href="/_sightglass/panel.css">
  <link rel="stylesheet" href="/_sightglass/terminal.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2025;
      --muted: #69707a;
      --line: #e3e6ea;
      --bar: #2f6fed;
      --led-off: #cfd3d8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111315;
        --card: #1b1e21;
        --text: #e8eaed;
        --muted: #9aa1a9;
        --line: #2c3034;
        --bar: #6ea0ff;
        --led-off: #3b3f44;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main, #dashboard { display: grid; gap: 16px; }
    main { max-width: 720px; margin: 0 auto; }

    header { display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }

    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .status .led { width: 10px; height: 10px; box-shadow: none; }
    html[data-connection="open"] .status .led { opacity: 1; background: var(--led-on); }
    html[data-connection="open"][data-stale] .status .led { background: #f2a900; }
    html[data-stale] .value { opacity: 0.45; }

    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    h2 { margin: 0; padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--muted);
         text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--line); }

    .row { display: grid; grid-template-columns: minmax(96px, 30%) 1fr; gap: 16px;
           align-items: center; padding: 10px 16px; }
    .row + .row { border-top: 1px solid var(--line); }
    .label { color: var(--muted); overflow-wrap: anywhere; }
    .value { font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }

    /* Fixed-width readout so the track doesn't jitter as the digits change. */
    .meter { display: grid; grid-template-columns: 1fr 11ch; gap: 12px; align-items: center; }
    .meter > span { text-align: right; white-space: nowrap; }
    .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .fill { height: 100%; width: 0; background: var(--bar); transition: width 80ms linear; }
    /* A range shows where the value sits, not how full it is. */
    .range .track { overflow: visible; position: relative; }
    .range .fill { background: none; border-right: 3px solid var(--bar); margin-right: -1.5px; border-radius: 0; }

    .spark { display: grid; grid-template-columns: 1fr 11ch; gap: 12px; align-items: center; }
    .spark > span { text-align: right; white-space: nowrap; }
    .chart { height: 24px; color: var(--bar); }
    .chart svg { display: block; }

    .empty { padding: 24px 16px; color: var(--muted); }
    .empty p { margin: 0 0 12px; }
    .empty pre { padding: 12px; border-radius: 8px; background: var(--bg); color: var(--text); overflow-x: auto; white-space: pre; }

    .lamps { display: flex; flex-wrap: wrap; gap: 8px 16px; }
    .lamp { display: flex; align-items: center; gap: 6px; }
    .value .led { width: 12px; height: 12px; }

    .table-scroll { overflow-x: auto; }  /* wide tables scroll inside, not the page */
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 4px 8px; text-align: left; border-bottom: 1px solid var(--line); }
    th { white-space: nowrap; }
    th.number, td.number { text-align: right; }  /* numeric columns line up on the right */
    /* Long text (a process name, a path) ends in "..."; hover for all of it. */
    td[data-column]:not(.number) { max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    th:first-child, td:first-child { color: var(--muted); font-weight: 400; }
    pre { margin: 0; font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; }

    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; gap: 4px; }  /* label above value */
    }

    .tools { display: flex; align-items: center; gap: 12px; }
    .switch { padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: none;
              color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
    .switch:hover { color: var(--text); }
    :focus-visible { outline: 2px solid var(--bar); outline-offset: 2px; }
    html:not([data-theme="terminal"]) [data-crt-switch] { display: none; }  /* nothing to switch */

    /* -- the terminal theme: tokens and CRT effects in /_sightglass/terminal.css -- */

    html[data-theme="terminal"] {
      --bg: var(--crt-bg); --card: var(--crt-surface); --text: var(--crt-fg); --muted: var(--crt-dim);
      --line: var(--crt-rule); --bar: var(--crt-fg); --led-off: var(--crt-grid);
      --led-on: var(--crt-fg); --led-on-glow: rgb(92 255 138 / 0.5);
    }
    html[data-theme="terminal"] body { font: 20px/1.25 var(--crt-font); letter-spacing: 0.02em; }
    html[data-theme="terminal"] main { max-width: 760px; }

    /* An inverted status bar. */
    html[data-theme="terminal"] header { padding: 4px 12px; background: var(--crt-fg); color: var(--crt-bg); text-shadow: none; }
    html[data-theme="terminal"] h1 { font-size: 26px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    html[data-theme="terminal"] .status { color: var(--crt-bg); font-size: 20px; text-transform: uppercase; }
    html[data-theme="terminal"] .status .led { border-radius: 0; background: none; outline: 1px solid var(--crt-bg); }
    html[data-theme="terminal"][data-connection="open"] .status .led { background: var(--crt-bg); }
    html[data-theme="terminal"] .switch { border: 1px solid var(--crt-bg); border-radius: 0; color: var(--crt-bg);
                                          font-size: 20px; text-transform: uppercase; }
    html[data-theme="terminal"] .switch::before { content: "["; }
    html[data-theme="terminal"] .switch::after { content: "]"; }
    html[data-theme="terminal"] .switch[aria-pressed="true"] { background: var(--crt-bg); color: var(--crt-fg); }
    html[data-theme="terminal"] :focus-visible { outline-color: var(--crt-bright); }

    /* Double-ruled panels, their names cut into the top edge. */
    html[data-theme="terminal"] #dashboard { gap: 26px; margin-top: 14px; }
    html[data-theme="terminal"] section { position: relative; border: 3px double var(--crt-rule); border-radius: 0; }
    html[data-theme="terminal"] section:has(> h2) { padding-top: 10px; }
    html[data-theme="terminal"] h2 { position: absolute; top: -0.7em; left: 12px; max-width: calc(100% - 24px);
      padding: 0 8px; border: 0; background: var(--crt-bg); color: var(--crt-bright); font-size: 22px;
      font-weight: 400; letter-spacing: 0.06em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    html[data-theme="terminal"] h2::before { content: "> "; color: var(--crt-fg); }
    html[data-theme="terminal"] .row + .row { border-top: 0; }

    /* Dot leaders from each name to its value, as a 1985 menu screen would. */
    html[data-theme="terminal"] .label { display: flex; align-items: baseline; gap: 6px; text-transform: uppercase; }
    html[data-theme="terminal"] .label::after { content: ""; flex: 1; min-width: 12px;
      border-bottom: 2px dotted var(--crt-muted); transform: translateY(-4px); }

    /* Bars in blocks; square lamps. */
    html[data-theme="terminal"] .track { height: 12px; border-radius: 0;
      background: repeating-linear-gradient(90deg, var(--crt-grid) 0 7px, transparent 7px 9px); }
    html[data-theme="terminal"] .fill {
      background: repeating-linear-gradient(90deg, var(--crt-fg) 0 7px, transparent 7px 9px); }
    /* A range as a cockpit's deviation scale: a tick every tenth, the middle marked, and a pointer. */
    html[data-theme="terminal"] .range .track {
      background: linear-gradient(var(--crt-dim) 0 0) 50% 0 / 1px 100% no-repeat,
        repeating-linear-gradient(90deg, var(--crt-muted) 0 1px, transparent 1px calc((100% - 1px) / 10)) 0 50% / 100% 6px no-repeat; }
    html[data-theme="terminal"] .range .fill { position: relative; background: none; border-right: 2px solid var(--crt-bright); margin-right: -1px; }
    html[data-theme="terminal"] .range .fill::after { content: ""; position: absolute; top: -7px; right: -6px; width: 10px; height: 7px;
      background: var(--crt-bright); clip-path: polygon(0 0, 100% 0, 50% 100%); }
    /* Charts on an oscilloscope's graticule. */
    html[data-theme="terminal"] .chart { height: 28px; background: radial-gradient(circle, var(--crt-muted) 1px, transparent 1.5px) 0 0 / 14px 14px; }
    html[data-theme="terminal"] .led { border-radius: 0; }
    html[data-theme="terminal"] th { color: var(--crt-bright); font-weight: 400; text-transform: uppercase; }
    html[data-theme="terminal"] th, html[data-theme="terminal"] td { border-bottom-color: var(--crt-grid); }
    html[data-theme="terminal"] pre { font: 20px/1.25 var(--crt-font); }

    html[data-theme="terminal"][data-connection="closed"] #connection { color: var(--crt-bg); background: var(--crt-amber); padding: 0 6px; }

    @media (forced-colors: none) {
      html[data-theme="terminal"][data-crt="on"] .chart svg { filter: drop-shadow(0 0 3px rgb(92 255 138 / 0.6)); }
    }

    @media (forced-colors: none) and (prefers-reduced-motion: no-preference) {
      html[data-theme="terminal"][data-crt="on"][data-connection="closed"] #connection { animation: crt-blink 1.1s steps(1, end) infinite; }
      /* Power on: the panels drawn one after another, then their names typed. */
      html[data-theme="terminal"][data-crt="on"] #dashboard > section {
        animation: crt-draw 0.24s steps(6, end) calc(0.25s + var(--boot, 8) * 70ms) backwards; }
      html[data-theme="terminal"][data-crt="on"] #dashboard h2 {
        animation: crt-type 0.36s steps(12, end) calc(0.45s + var(--boot, 8) * 70ms) backwards; }
      html[data-theme="terminal"] #dashboard > :nth-child(1) { --boot: 0; }
      html[data-theme="terminal"] #dashboard > :nth-child(2) { --boot: 1; }
      html[data-theme="terminal"] #dashboard > :nth-child(3) { --boot: 2; }
      html[data-theme="terminal"] #dashboard > :nth-child(4) { --boot: 3; }
      html[data-theme="terminal"] #dashboard > :nth-child(5) { --boot: 4; }
      html[data-theme="terminal"] #dashboard > :nth-child(6) { --boot: 5; }
      html[data-theme="terminal"] #dashboard > :nth-child(7) { --boot: 6; }
      html[data-theme="terminal"] #dashboard > :nth-child(8) { --boot: 7; }
    }

    @media (max-width: 520px) {
      html[data-theme="terminal"] .label::after { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="title">Monitor</h1>
      <div class="tools">
        <div class="status"><span class="led"></span><span id="connection">Connecting</span></div>
        <button type="button" class="switch" data-theme-switch>Terminal</button>
        <button type="button" class="switch" data-crt-switch>CRT</button>
      </div>
    </header>
    <div id="dashboard"></div>
    <template id="empty">
      <section class="empty">
        <p>Waiting for values. Anything you send appears here, for example:</p>
        <pre data-example></pre>
      </section>
    </template>
  </main>

  <script>
    const el = (tag, { dataset = {}, ...props } = {}, ...children) => {
      const node = Object.assign(document.createElement(tag), props);
      Object.assign(node.dataset, dataset);
      node.append(...children);
      return node;
    };
    const bound = (tag, key, { dataset = {}, ...props } = {}) =>
      el(tag, { ...props, dataset: { bind: key, ...dataset } });

    function valueFor(item) {
      switch (item.kind) {
        case "IndicatorLamp":
          return el("div", { className: "lamps" }, bound("div", item.id, { className: "led", dataset: { mode: "state" } }));
        case "MachineState":
          return el("div", { className: "lamps" }, ...item.states.map((state) =>
            el("span", { className: "lamp" }, bound("span", `${item.id}.${state}`, { className: "led", dataset: { mode: "state" } }), state)));
        case "ProgressBar":
        case "RangeBar":
          return el("div", { className: item.kind === "RangeBar" ? "meter range" : "meter" },
            el("div", { className: "track" }, bound("div", `${item.id}.ratio`, { className: "fill", dataset: { mode: "width" } })),
            bound("span", `${item.id}.text`));
        case "Coordinate":
          return el("div", { className: "lamps" }, ...item.axes.map((axis) =>
            el("span", {}, `${axis.toUpperCase()} `, bound("span", `${item.id}.${axis}`), item.units ? ` ${item.units}` : "")));
        case "Table":
          return el("div", { className: "table-scroll" }, el("table", {},
            el("tr", {}, el("th"), ...item.columns.map((column) => el("th", { dataset: { column } }, column))),
            ...item.rows.map((row) => el("tr", {}, el("td", {}, row),
              ...item.columns.map((column) => bound("td", `${item.id}.${row}.${column}`, { dataset: { column } }))))));
        case "LogMonitor":
          return bound("pre", item.id);
        case "Sparkline":
          return el("div", { className: "spark" },
            bound("div", `${item.id}.values`, { className: "chart", dataset: { mode: "sparkline" } }),
            bound("span", `${item.id}.text`));
        default:
          return el("span", {}, bound("span", item.id), item.units ? ` ${item.units}` : "");
      }
    }

    // Right-align a table column when everything in it is a number.
    const NUMBER = /^[-+]?[\d.,]+\s*%?$/;
    document.addEventListener("monitor:update", () => {
      for (const table of document.querySelectorAll("#dashboard table")) {
        const columns = new Map();
        for (const cell of table.querySelectorAll("[data-column]")) {
          if (!columns.has(cell.dataset.column)) columns.set(cell.dataset.column, []);
          columns.get(cell.dataset.column).push(cell);
        }
        for (const cells of columns.values()) {
          const values = cells.filter((c) => c.tagName === "TD" && c.textContent.trim());
          const numeric = values.length > 0 && values.every((c) => NUMBER.test(c.textContent.trim()));
          for (const cell of cells) {
            cell.classList.toggle("number", numeric);
            if (cell.tagName === "TD") cell.title = cell.textContent;
          }
        }
      }
    });

    const row = (item) => el("div", { className: "row" }, el("div", { className: "label" }, item.label), el("div", { className: "value" }, valueFor(item)));

    function showEmptyState() {
      const hint = document.getElementById("empty").content.cloneNode(true);
      hint.querySelector("[data-example]").textContent =
        `monitor.set("temperature", 21.5)          # from Python\n` +
        `curl -d 'temperature=21.5' ${location.origin}/update`;
      document.getElementById("dashboard").replaceChildren(hint);
    }

    document.addEventListener("monitor:snapshot", ({ detail }) => {
      document.getElementById("title").textContent = detail.title;
      document.title = detail.title;
      if (detail.layout.length === 0) return showEmptyState();
      const sections = [];
      let loose = null;
      for (const item of detail.layout) {
        if (item.group) {
          loose = null;
          sections.push(el("section", {}, el("h2", {}, item.group), ...item.elements.map(row)));
        } else {
          if (!loose) sections.push((loose = el("section")));
          loose.append(row(item));
        }
      }
      document.getElementById("dashboard").replaceChildren(...sections);
    });

    // "Live" when data is flowing; otherwise how long since the last value.
    let age = null;
    const ago = (seconds) => seconds < 90 ? `${Math.round(seconds)} s` : `${Math.round(seconds / 60)} min`;
    function renderStatus() {
      const root = document.documentElement;
      const text = { closed: "Disconnected, retrying", connecting: "Connecting" }[root.dataset.connection]
        ?? (root.dataset.stale ? `No data for ${ago(age)}`
          : age === null || age < 3 ? "Live" : `Live, last update ${ago(age)} ago`);
      document.getElementById("connection").textContent = text;
    }
    document.addEventListener("monitor:tick", ({ detail }) => { age = detail.age; renderStatus(); });
    new MutationObserver(renderStatus).observe(document.documentElement, { attributes: true, attributeFilter: ["data-connection"] });
  </script>
  <script src="/_sightglass/sightglass.js"></script>
</body>
</html>
