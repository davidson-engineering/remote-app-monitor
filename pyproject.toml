[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sightglass"
description = "Live dashboards for a running program, a device, or anything that can make an HTTP request."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Davidson", email = "matthew@davidson.engineering" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
zmq = ["pyzmq>=26"]
web = ["aiohttp>=3.10"]
all = ["sightglass[serial,zmq,web]"]

[project.scripts]
sightglass = "sightglass.cli:main"

[project.urls]
Repository = "https://github.com/davidson-engineering/sightglass"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "playwright>=1.50",
  "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = { attr = "sightglass.__version__" }

[tool.setuptools.package-data]
sightglass = ["web/static/**/*", "GUIDE.md", "launch/*.html", "launch/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
  "browser: runs in Chromium (install it once: uv run playwright install chromium)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["sightglass"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
  "RUF001", # box-drawing and lamp glyphs in strings are intentional
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501"]  # run commands in docstrings are one copyable line
